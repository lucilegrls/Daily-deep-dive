name: CI

on:
  pull_request:
  push:
    branches: [cursor-migration]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Lint changed source files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$EVENT_BEFORE"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then base="$PR_BASE_SHA"; fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="HEAD^"; fi
          git diff --diff-filter=ACMR --name-only -z "$base" HEAD -- '*.js' '*.mjs' '*.cjs' '*.ts' '*.tsx' \
            | xargs -0 -r pnpm exec eslint
      - run: pnpm build:cloudflare
