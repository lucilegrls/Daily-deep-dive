<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily deep dive</title>
  <meta name="description" content="A new rabbit hole every day, with books, papers, videos and articles to follow it.">
  <meta name="theme-color" content="#F5E6D1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2A2226" media="(prefers-color-scheme: dark)">
  <script>document.documentElement.className = 'js';</script>
  <!-- pwa:start -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- pwa:end -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Colorful backdrop: gradient + scattered organic shapes (decorative only) -->
  <div class="backdrop" aria-hidden="true">
    <svg class="deco deco-blob" viewBox="0 0 200 200">
      <path d="M44.7-58.9C57.5-49.5 67-35.3 71.2-19.5 75.4-3.7 74.3 13.7 66.9 27.5 59.5 41.3 45.8 51.5 30.9 58.9 16 66.3-.1 70.9-16.4 68.1-32.7 65.3-49.2 55.1-60.2 40.6-71.2 26.1-76.7 7.3-73.2-9.6-69.7-26.5-57.2-41.5-42.6-50.6-28-59.7-11.3-62.9 3.6-67.4 18.5-71.9 31.9-68.3 44.7-58.9Z" transform="translate(100 100)"/>
    </svg>
    <svg class="deco deco-arch" viewBox="0 0 200 230" fill="none">
      <path d="M20 230V110a80 80 0 0 1 160 0v120"/>
      <path d="M48 230V112a52 52 0 0 1 104 0v118"/>
      <path d="M76 230V114a24 24 0 0 1 48 0v116"/>
    </svg>
    <svg class="deco deco-dots" viewBox="0 0 120 120">
      <defs><pattern id="dotgrid" width="15" height="15" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2.2"/></pattern></defs>
      <rect width="120" height="120" fill="url(#dotgrid)"/>
    </svg>
    <svg class="deco deco-sun" viewBox="0 0 120 60"><path d="M0 60a60 60 0 0 1 120 0Z"/></svg>
    <svg class="deco deco-leaf" viewBox="0 0 100 160">
      <path d="M50 4C92 40 92 112 50 156 8 112 8 40 50 4Z"/>
      <path class="vein" d="M50 20v130M50 60l-18-14M50 88l20-16M50 116l-20-14" fill="none"/>
    </svg>
    <svg class="deco deco-squiggle" viewBox="0 0 200 40" fill="none">
      <path d="M2 20q12-18 24 0t24 0 24 0 24 0 24 0 24 0 24 0 24 0"/>
    </svg>
    <svg class="deco deco-spark s1" viewBox="0 0 24 24"><path d="M12 0c1 8 4 11 12 12-8 1-11 4-12 12-1-8-4-11-12-12 8-1 11-4 12-12Z"/></svg>
    <svg class="deco deco-spark s2" viewBox="0 0 24 24"><path d="M12 0c1 8 4 11 12 12-8 1-11 4-12 12-1-8-4-11-12-12 8-1 11-4 12-12Z"/></svg>
    <svg class="deco deco-spark s3" viewBox="0 0 24 24"><path d="M12 0c1 8 4 11 12 12-8 1-11 4-12 12-1-8-4-11-12-12 8-1 11-4 12-12Z"/></svg>
    <div class="grain"></div>
  </div>

  <div class="page">
    <header class="masthead">
      <p class="brand">Daily deep dive</p>
      <div class="actions">
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch to dark mode">
          <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="refresh-btn" id="refresh">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="label">New topic</span>
        </button>
      </div>
    </header>

    <section class="intro">
      <p class="dateline" id="date"></p>
      <p class="greeting" id="greeting">Hello, Lucile</p>
      <p class="sub">Here's today's rabbit hole. Ten minutes, one good question, and wherever it leads.</p>
    </section>

    <main class="stage">
      <article class="card" id="card" aria-labelledby="topic-title">
        <span class="tape" aria-hidden="true"></span>
        <div class="card-top">
          <span class="tag" id="topic-tag">Loading</span>
          <span class="pick" id="pick-label"></span>
        </div>
        <h1 class="title" id="topic-title">
          <span class="title-lead" id="title-lead"></span>
          <span class="title-rest" id="title-rest">Opening today's topic</span>
        </h1>
        <p class="context" id="topic-context"></p>
        <h2 class="section-label" id="takeaways-label">Worth remembering</h2>
        <ul class="takeaways" id="topic-takeaways" aria-labelledby="takeaways-label"></ul>
        <div class="card-foot">
          <button type="button" class="text-btn" id="back-today" hidden>Back to today's pick</button>
        </div>
      </article>

      <div class="envelope-wrap" id="envelope-wrap">
        <button type="button" class="envelope" id="envelope" aria-expanded="false" aria-controls="sheet" aria-label="Open ressources">
          <span class="env-back"></span>
          <span class="env-letter"><span class="env-count" id="env-count"></span></span>
          <span class="env-pocket"></span>
          <span class="env-flap"></span>
          <span class="env-seal" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 0c1 8 4 11 12 12-8 1-11 4-12 12-1-8-4-11-12-12 8-1 11-4 12-12Z" fill="currentColor"/></svg>
          </span>
          <span class="env-label">Ressources</span>
        </button>
        <p class="env-hint" id="env-hint" aria-hidden="true">tap to open</p>
      </div>
    </main>

    <footer class="colophon">
      <p id="bank-count"></p>
    </footer>
  </div>

  <p class="sr-only" id="live" aria-live="polite"></p>

  <!-- Ressources sheet -->
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true">
    <div class="sheet-paper" id="sheet-scroll">
      <div class="paper-inner">
        <img class="paper-cap paper-cap-top" src="icon/paper-top.png" alt="" aria-hidden="true">
        <div class="paper-fill">
          <span class="sheet-grip" aria-hidden="true"></span>
          <div class="sheet-head">
            <p class="sheet-kicker">Ressources for</p>
            <h2 class="sheet-title" id="sheet-title"></h2>
            <button type="button" class="icon-btn sheet-close" id="sheet-close" aria-label="Close ressources">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div id="sheet-body"></div>
          <p class="sheet-sign">Happy digging, Lucile</p>
        </div>
        <img class="paper-cap paper-cap-bottom" src="icon/paper-bottom.png" alt="" aria-hidden="true">
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
