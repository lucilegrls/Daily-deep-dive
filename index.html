<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFC8CB">
    <meta name="description" content="Daily Deep Dive - A new rabbit hole every day">
    <title>Daily Deep Dive</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><circle cx='96' cy='96' r='90' fill='%23FFB6C1'/></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #FFF5F0 0%, #FFE4E1 50%, #F5E6D1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .date {
            font-size: 12px;
            color: #9FBB9F;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .topic-card {
            background: linear-gradient(135deg, rgba(255, 200, 203, 0.3) 0%, rgba(200, 213, 183, 0.2) 100%);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(200, 213, 183, 0.4);
            border-radius: 24px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(159, 187, 159, 0.1);
            animation: slideIn 0.6s ease-out;
            transform: rotate(-2deg);
            margin-left: 8px;
            margin-right: -8px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px) rotate(-2deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotate(-2deg);
            }
        }

        .topic-title {
            font-size: 28px;
            font-weight: 700;
            color: #2C2C2C;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .topic-title .subtitle {
            display: block;
            font-size: 18px;
            font-weight: 500;
            color: #9FBB9F;
            margin-top: 8px;
        }

        .topic-context {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .takeaways {
            text-align: left;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 24px;
        }

        .takeaways h3 {
            font-size: 14px;
            color: #9FBB9F;
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .takeaways ul {
            list-style: none;
        }

        .takeaways li {
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            padding-left: 20px;
            position: relative;
        }

        .takeaways li:before {
            content: "•";
            position: absolute;
            left: 0;
            color: #9FBB9F;
            font-weight: bold;
        }

        .envelope-wrapper {
            perspective: 1000px;
            width: 100%;
            height: 280px;
            position: relative;
            margin: 20px 0;
            cursor: pointer;
            transform: rotate(3deg);
        }

        .envelope {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform-style: preserve-3d;
        }

        .envelope.open {
            transform: rotateY(180deg);
        }

        .envelope-front,
        .envelope-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .envelope-back {
            transform: rotateY(180deg);
            position: relative;
        }

        .envelope-image {
            width: 85%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(159, 187, 159, 0.15));
        }

        .paper-image {
            position: absolute;
            width: 70%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 6px 16px rgba(159, 187, 159, 0.2));
            z-index: 10;
        }

        .ressources-content {
            position: absolute;
            width: 65%;
            max-height: 320px;
            overflow-y: auto;
            padding: 80px 30px 40px 30px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 11;
            text-align: center;
        }

        .ressource-category {
            margin-bottom: 16px;
            text-align: left;
        }

        .ressource-category h4 {
            font-size: 11px;
            font-weight: 600;
            color: #9FBB9F;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .ressource-item {
            margin-bottom: 8px;
            padding: 8px;
            background: rgba(245, 230, 209, 0.3);
            border-radius: 6px;
            border-left: 2px solid #9FBB9F;
        }

        .ressource-item p {
            font-size: 11px;
            color: #555;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .ressource-item a {
            font-size: 10px;
            color: #9FBB9F;
            text-decoration: none;
            font-weight: 500;
            word-break: break-word;
            transition: color 0.3s ease;
        }

        .ressource-item a:hover {
            color: #2C2C2C;
            text-decoration: underline;
        }

        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }

        button {
            background: linear-gradient(135deg, #9FBB9F 0%, #B8C8A8 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(159, 187, 159, 0.25);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(159, 187, 159, 0.35);
        }

        button:active {
            transform: translateY(0);
        }

        .loading {
            text-align: center;
            color: #9FBB9F;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .topic-card {
                padding: 30px 24px;
            }

            .topic-title {
                font-size: 24px;
            }

            .topic-title .subtitle {
                font-size: 16px;
            }

            .envelope-wrapper {
                height: 220px;
            }

            button {
                padding: 12px 24px;
                font-size: 12px;
            }
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #2a2a2a 0%, #1f1f1f 50%, #2c2418 100%);
            }

            .topic-card {
                background: linear-gradient(135deg, rgba(100, 80, 80, 0.3) 0%, rgba(80, 100, 80, 0.2) 100%);
                border-color: rgba(159, 187, 159, 0.2);
            }

            .topic-title {
                color: #e8e8e8;
            }

            .topic-context {
                color: #aaa;
            }

            .takeaways {
                background: rgba(60, 60, 60, 0.5);
            }

            .takeaways li {
                color: #aaa;
            }

            .ressource-item {
                background: rgba(100, 80, 80, 0.3);
            }

            .ressource-item p {
                color: #aaa;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="date" id="todayDate">Today</div>
        </div>

        <div class="topic-card">
            <h1 class="topic-title" id="topicTitle">Loading today's topic...</h1>
            <p class="topic-context" id="topicContext"></p>
            
            <div class="takeaways" id="takeawaysSection" style="display: none;">
                <h3>Key takeaways</h3>
                <ul id="takeawaysList"></ul>
            </div>

            <div class="envelope-wrapper" id="envelopeWrapper">
                <div class="envelope" id="envelope">
                    <div class="envelope-front">
                        <img src="icons/envelope.png" alt="Click to open" class="envelope-image">
                    </div>
                    <div class="envelope-back">
                        <img src="icons/envelope-paper.png" alt="Ressources" class="paper-image">
                        <div class="ressources-content" id="ressourcesContent">
                            <div class="loading">Loading ressources...</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button id="refreshBtn">New Topic</button>
                <button id="themeBtn">🌙 Theme</button>
            </div>
        </div>
    </div>

    <script>
        // Initialize
        function init() {
            loadTopic();
            setupEnvelope();
            setupTheme();
            setDate();
            registerServiceWorker();
        }

        function setDate() {
            const options = { weekday: 'long', month: 'short', day: 'numeric' };
            const today = new Date().toLocaleDateString('en-US', options);
            document.getElementById('todayDate').textContent = today;
        }

        function setupEnvelope() {
            const envelopeWrapper = document.getElementById('envelopeWrapper');
            const envelope = document.getElementById('envelope');

            envelopeWrapper.addEventListener('click', () => {
                envelope.classList.toggle('open');
            });
        }

        function setupTheme() {
            const themeBtn = document.getElementById('themeBtn');
            const stored = localStorage.getItem('theme') || 'light';
            if (stored === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }

            themeBtn.addEventListener('click', () => {
                const current = localStorage.getItem('theme') || 'light';
                const next = current === 'light' ? 'dark' : 'light';
                localStorage.setItem('theme', next);
                document.documentElement.setAttribute('data-theme', next);
            });
        }

        async function loadTopic() {
            try {
                const response = await fetch('topics.json');
                const data = await response.json();
                const topic = data.topics[0]; // Load first topic for now

                document.getElementById('topicTitle').innerHTML = formatTitle(topic.title);
                document.getElementById('topicContext').textContent = topic.context;

                if (topic.takeaways && topic.takeaways.length > 0) {
                    const takeawaysList = document.getElementById('takeawaysList');
                    takeawaysList.innerHTML = topic.takeaways.map(t => `<li>${t}</li>`).join('');
                    document.getElementById('takeawaysSection').style.display = 'block';
                }

                renderRessources(topic.ressources);
                setupRefresh();
            } catch (error) {
                console.error('Error loading topic:', error);
                document.getElementById('topicTitle').textContent = 'Error loading topic';
            }
        }

        function formatTitle(title) {
            const [main, subtitle] = title.split(':');
            if (subtitle) {
                return `${main.trim()}<span class="subtitle">${subtitle.trim()}</span>`;
            }
            return main;
        }

        function renderRessources(ressources) {
            let html = '';

            if (ressources.books && ressources.books.length > 0) {
                html += '<div class="ressource-category"><h4>📚 Books</h4>';
                ressources.books.forEach(book => {
                    html += `<div class="ressource-item"><p><strong>${book.title}</strong> by ${book.author}</p><p>${book.hook}</p><a href="${book.url}" target="_blank">→ Learn more</a></div>`;
                });
                html += '</div>';
            }

            if (ressources.papers && ressources.papers.length > 0) {
                html += '<div class="ressource-category"><h4>📄 Papers</h4>';
                ressources.papers.forEach(paper => {
                    html += `<div class="ressource-item"><p><strong>${paper.title}</strong></p><p>${paper.source}</p><a href="${paper.url}" target="_blank">→ Read</a></div>`;
                });
                html += '</div>';
            }

            if (ressources.videos && ressources.videos.length > 0) {
                html += '<div class="ressource-category"><h4>🎥 Videos</h4>';
                ressources.videos.forEach(video => {
                    html += `<div class="ressource-item"><p><strong>${video.title}</strong></p><p>${video.creator}</p><a href="${video.url}" target="_blank">→ Watch</a></div>`;
                });
                html += '</div>';
            }

            if (ressources.articles && ressources.articles.length > 0) {
                html += '<div class="ressource-category"><h4>📰 Articles</h4>';
                ressources.articles.forEach(article => {
                    html += `<div class="ressource-item"><p><strong>${article.title}</strong></p><p>${article.publication}</p><a href="${article.url}" target="_blank">→ Read</a></div>`;
                });
                html += '</div>';
            }

            document.getElementById('ressourcesContent').innerHTML = html;
        }

        function setupRefresh() {
            document.getElementById('refreshBtn').addEventListener('click', () => {
                location.reload();
            });
        }

        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
            }
        }

        // Load when ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
